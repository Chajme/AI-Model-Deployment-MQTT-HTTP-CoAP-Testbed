services:

#  # ========================
#  # MQTT
#  # ========================
  mosquitto-broker:
    image: eclipse-mosquitto:latest
    ports:
      - "1883:1883"
    networks:
      - mqtt-net
    volumes:
      - ./protocols/MQTT/mosquitto.conf:/mosquitto-broker/mosquitto.conf

  mqtt-client-a:
    build: ./
#    command: python -m protocols.MQTT.clients.client_a
    cap_add:
      - NET_ADMIN
#    command: [ "/app/scripts/network_chaos.sh" ]
    depends_on:
      - mosquitto-broker
    volumes:
      - ./output:/app/output
      - ./:/app
      - ./data:/app/data
    networks:
      - mqtt-net
    environment:
#      - APP_COMMAND=python -m protocols.MQTT.clients.client_a
#      - NETWORK_PROFILE=iot   # or good/harsh/mobile/satellite
      - MEASUREMENT_SUFFIX=_testing
    entrypoint: ["sleep", "infinity"]

  mqtt-client-b:
    build: ./
    cap_add:
      - NET_ADMIN
#    command: [ "/app/scripts/network_chaos.sh" ]
    command: python -m protocols.MQTT.clients.client_b
    depends_on:
      - mosquitto-broker
    volumes:
      - ./output:/app/output
      - ./:/app
    networks:
      - mqtt-net
    environment:
#      - APP_COMMAND=python -m protocols.MQTT.clients.client_b
#      - NETWORK_PROFILE=iot
      - MEASUREMENT_SUFFIX=_testing

  mqtt-capture:
    image: nicolaka/netshoot   # small image with tcpdump preinstalled
    depends_on:
      - mosquitto-broker
    network_mode: "service:mosquitto-broker"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./output/pcap:/pcap
    # Stays alive but idle -- tcpdump is started/stopped per transfer via
    # `docker compose exec mqtt-capture tcpdump ...` from the test harness,
    # so each run gets its own pcap file instead of one long capture.
    entrypoint: [ "sleep", "infinity" ]

